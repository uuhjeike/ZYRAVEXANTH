<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>ZYRAVEXANTH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="br"><h1>ZYRAVEXANTH</h1><p>One universe. Infinite worlds. Limitless identities.</p></div>
  <form id="sf" class="sf" role="search" autocomplete="off">
    <select id="sm" aria-label="Search by">
      <option value="id">ID</option><option value="name">Name</option><option value="prof">Profession</option><option value="planet">Planet</option><option value="galaxy">Galaxy</option>
    </select>
    <div class="fld">
      <input id="si" type="text" inputmode="numeric" spellcheck="false" autocapitalize="off" placeholder="Profile ID" aria-label="Search query">
      <button type="button" id="sx" class="x" hidden aria-label="Clear search"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <button type="submit" class="ic" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 16l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button type="button" id="un" class="uv">Explore universe</button>
  </form>
</header>
<main><div id="feed" class="feed" aria-label="Profiles"></div></main>
<aside id="dr" class="dr" aria-label="Universe">
  <div class="dh"><button id="bk" type="button" aria-label="Back">&#8249;</button><h2 id="dt"></h2><button id="cl" type="button" aria-label="Close">&#10005;</button></div>
  <p id="st" class="st" aria-live="polite"></p>
  <div id="db" class="db"></div>
</aside>
<script src="script.js"></script>
</body>
</html>
